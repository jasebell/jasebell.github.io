<!DOCTYPE html>
<html>

<head>

    <title>Knowledge Graph</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #cy {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #fff;
        }

        body {
            background-color: #fff;
        }

        .graph-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            z-index: 10;
            max-width: 300px;
        }

        .graph-info h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }

        .graph-info p {
            margin: 5px 0;
            color: #666;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .controls button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin: 5px 0;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
        }

        .controls button:hover {
            background: #0052a3;
        }

        .selected-node {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            min-width: 200px;
        }

        .selected-node h4 {
            margin-top: 0;
            color: #333;
        }

        .selected-node p {
            margin: 5px 0;
            color: #666;
            font-size: 10px;
        }

</head>

    <div id="cy"></div>
     
    <div class="graph-info">

        <p><strong>Nodes:</strong> Person,Employment, Skill, Book, Conference</p>
        <p><strong>Edges:</strong> Relationships between entities</p>
        <p><em>Click a node to see details</em></p>
        <p><a href="index.html">Back to Home</a></p>
    </div>

    <div class="controls">
        <h3>Graph Controls</h3>
        <button onclick="cy.layout({ name: 'cose' }).run()">Layout: Cose</button>
        <button onclick="cy.layout({ name: 'grid' }).run()">Layout: Grid</button>
        <button onclick="cy.layout({ name: 'circle' }).run()">Layout: Circle</button>
        <button onclick="cy.fit()">Fit to View</button>

        // Node selection and info display
        cy.on('tap', 'node', function (evt) {
            const node = evt.target;
            const nodeInfo = document.getElementById('nodeInfo');

            // Remove highlight from all edges first
            cy.edges().removeClass('highlighted');

            // Get connected edges and highlight them
            const connectedEdges = node.connectedEdges();
            connectedEdges.addClass('highlighted');

            // Update info panel
            document.getElementById('nodeName').textContent = node.data('label');
            document.getElementById('nodeType').textContent = node.data('type') || 'Unknown';
            document.getElementById('nodeConnections').textContent = connectedEdges.length;

            nodeInfo.style.display = 'block';
        });

        // Hide info panel when clicking elsewhere
        cy.on('tap', function (evt) {
            if (evt.target === cy) {
                document.getElementById('nodeInfo').style.display = 'none';
                cy.elements().unselect();
                cy.edges().removeClass('highlighted');
            }
